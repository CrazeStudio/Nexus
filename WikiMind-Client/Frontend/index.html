<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WikiMind AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #0b0f14;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px;
    border-bottom: 1px solid #252b34;
}

header h1 {
    margin: 0;
}

header p {
    color: #8b949e;
    margin: 5px 0 0;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 900px;
    width: 100%;
    margin: auto;
}

.message {
    padding: 13px 16px;
    border-radius: 12px;
    margin: 10px 0;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user {
    background: #1f2937;
    margin-left: 15%;
}

.ai {
    background: #151a21;
    border: 1px solid #29313c;
    margin-right: 15%;
}

.sources {
    margin-top: 8px;
    color: #7d8794;
    font-size: 12px;
}

form {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 900px;
    padding: 14px;
    margin: auto;
}

input {
    flex: 1;
    padding: 14px;
    background: #151a21;
    color: white;
    border: 1px solid #303844;
    border-radius: 10px;
    outline: none;
}

button {
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>WikiMind AI</h1>
    <p>Mini Neural Brain + Wikipedia + DuckDuckGo</p>
</header>

<div id="chat">
    <div class="message ai">
        Hello. I am WikiMind. Ask me something.
    </div>
</div>

<form id="form">
    <input
        id="input"
        placeholder="Ask anything..."
        autocomplete="off"
        required
    >

    <button type="submit">Ask</button>
</form>

<script type="module">

import { answerQuestion } from "../Backend/brain.js";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");

function addMessage(text, type, sources = []) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    if (sources.length) {

        const source = document.createElement("div");

        source.className = "sources";

        source.textContent =
            "Sources: " + sources.join(" • ");

        message.appendChild(source);
    }

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async event => {

    event.preventDefault();

    const question = input.value.trim();

    if (!question) return;

    addMessage(question, "user");

    input.value = "";

    addMessage("Thinking...", "ai");

    const thinking =
        chat.lastElementChild;

    try {

        const result =
            await answerQuestion(question);

        thinking.textContent =
            result.answer;

        if (result.sources?.length) {

            const source =
                document.createElement("div");

            source.className = "sources";

            source.textContent =
                "Sources: " +
                result.sources.join(" • ");

            thinking.appendChild(source);
        }

    } catch (error) {

        console.error(error);

        thinking.textContent =
            "Something went wrong.";
    }
});

</script>

</body>
</html>
