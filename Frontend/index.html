<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CrazeMind</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-bottom: 1px solid #222936;
            background: #11161d;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
        }

        .brand span {
            font-size: 12px;
            opacity: 0.55;
            margin-left: 6px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 850px;
            padding: 13px 16px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: #2563eb;
        }

        .ai-message {
            align-self: flex-start;
            background: #1b222c;
        }

        .source {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 7px;
        }

        #input-area {
            padding: 12px;
            border-top: 1px solid #222936;
            background: #11161d;
        }

        #chat-form {
            display: flex;
            gap: 8px;
            max-width: 1000px;
            margin: auto;
        }

        #message {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            border: 1px solid #303846;
            border-radius: 12px;
            outline: none;
            background: #0d1117;
            color: white;
            font-size: 15px;
        }

        #message:focus {
            border-color: #2563eb;
        }

        #send {
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .welcome {
            margin: auto;
            text-align: center;
            opacity: 0.65;
        }

        .welcome h1 {
            margin-bottom: 6px;
        }

        @media (max-width: 600px) {

            #chat {
                padding: 12px;
            }

            .message {
                max-width: 90%;
            }

            #send {
                padding: 0 15px;
            }
        }

    </style>
</head>


<body>

    <header>

        <div class="brand">
            CrazeMind
            <span>by CrazeStudio</span>
        </div>

    </header>


    <main id="chat">

        <div
            id="welcome"
            class="welcome"
        >

            <h1>CrazeMind</h1>

            <div>
                Ask me anything.
            </div>

        </div>

    </main>


    <div id="input-area">

        <form id="chat-form">

            <input
                id="message"
                type="text"
                placeholder="Ask CrazeMind..."
                autocomplete="off"
            >

            <button
                id="send"
                type="submit"
            >
                Send
            </button>

        </form>

    </div>


    <script type="module">

        import {
            answerQuestion
        } from "../Backend/brain.js";


        const form =
            document.getElementById(
                "chat-form"
            );


        const input =
            document.getElementById(
                "message"
            );


        const chat =
            document.getElementById(
                "chat"
            );


        const send =
            document.getElementById(
                "send"
            );


        const welcome =
            document.getElementById(
                "welcome"
            );


        /* =================================================
           Escape HTML
        ================================================= */

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        /* =================================================
           Add message
        ================================================= */

        function addMessage(
            text,
            type,
            sources = []
        ) {

            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "message " +
                (
                    type === "user"
                        ? "user-message"
                        : "ai-message"
                );


            message.innerHTML =
                escapeHTML(text);


            if (
                sources &&
                sources.length
            ) {

                const source =
                    document.createElement(
                        "div"
                    );


                source.className =
                    "source";


                source.textContent =
                    "Source: " +
                    sources.join(
                        ", "
                    );


                message.appendChild(
                    source
                );
            }


            chat.appendChild(
                message
            );


            chat.scrollTop =
                chat.scrollHeight;


            return message;
        }


        /* =================================================
           Submit
        ================================================= */

        form.addEventListener(
            "submit",
            async function(event) {

                /*
                    THIS IS THE FIX.

                    Without this, the browser submits
                    the form and reloads the page.
                */

                event.preventDefault();


                const question =
                    input.value.trim();


                if (!question) {
                    return;
                }


                if (welcome) {

                    welcome.remove();
                }


                /*
                    Show user message.
                */

                addMessage(
                    question,
                    "user"
                );


                /*
                    Clear input immediately.
                */

                input.value = "";


                /*
                    Prevent duplicate requests
                    while thinking.
                */

                send.disabled =
                    true;

                input.disabled =
                    true;


                /*
                    Thinking message.
                */

                const thinking =
                    addMessage(
                        "Thinking...",
                        "ai"
                    );


                try {

                    const result =
                        await answerQuestion(
                            question
                        );


                    /*
                        Replace "Thinking..."
                        with actual answer.
                    */

                    thinking.innerHTML =
                        escapeHTML(
                            result.answer ||
                            "I couldn't generate an answer."
                        );


                    if (
                        result.sources &&
                        result.sources.length
                    ) {

                        const source =
                            document.createElement(
                                "div"
                            );


                        source.className =
                            "source";


                        source.textContent =
                            "Source: " +
                            result.sources.join(
                                ", "
                            );


                        thinking.appendChild(
                            source
                        );
                    }


                } catch (error) {

                    console.error(
                        "CrazeMind error:",
                        error
                    );


                    thinking.innerHTML =
                        escapeHTML(
                            "Something went wrong: " +
                            error.message
                        );
                }


                /*
                    Re-enable input.
                */

                send.disabled =
                    false;

                input.disabled =
                    false;

                input.focus();


                chat.scrollTop =
                    chat.scrollHeight;

            }
        );


        /* =================================================
           Enter key
        ================================================= */

        input.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    form.requestSubmit();
                }
            }
        );

    </script>

</body>

</html>
