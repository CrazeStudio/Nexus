<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b0f14"
    >

    <title>CrazeMind</title>


    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Security -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #0b0f14;

            color: #f4f7fb;
        }


        button,
        input,
        textarea {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        /* =================================
           APP
        ================================= */

        .app {

            width: 100%;
            height: 100%;

            display: flex;
        }


        /* =================================
           SIDEBAR
        ================================= */

        .sidebar {

            width: 280px;
            height: 100%;

            display: flex;
            flex-direction: column;

            background: #0f141b;

            border-right:
                1px solid #202731;

            transition:
                transform .25s ease;
        }


        .sidebar-header {

            padding: 16px;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 16px;
        }


        .logo {

            width: 38px;
            height: 38px;

            display: grid;

            place-items: center;

            border-radius: 11px;

            background: #2563eb;

            font-size: 18px;

            font-weight: 800;
        }


        .brand-name {

            font-weight: 700;

            font-size: 16px;
        }


        .brand-sub {

            margin-top: 2px;

            color: #6f7a89;

            font-size: 11px;
        }


        .new-chat {

            width: 100%;

            padding: 11px;

            border:
                1px solid #293240;

            border-radius: 10px;

            background: #161d26;

            color: #e8edf4;
        }


        .new-chat:hover {

            background: #1c2530;
        }


        /* =================================
           SEARCH CHATS
        ================================= */

        .history-search {

            margin:
                0 16px 12px;
        }


        .history-search input {

            width: 100%;

            padding:
                10px 11px;

            border:
                1px solid #293240;

            border-radius: 9px;

            outline: none;

            background: #0b1016;

            color: white;
        }


        .history-search input:focus {

            border-color: #2563eb;
        }


        /* =================================
           HISTORY
        ================================= */

        .history {

            flex: 1;

            overflow-y: auto;

            padding:
                0 10px;
        }


        .history-title {

            padding:
                8px 7px;

            color: #687483;

            font-size: 11px;

            text-transform: uppercase;
        }


        .history-item {

            width: 100%;

            display: flex;

            padding:
                10px 9px;

            margin-bottom: 3px;

            border: 0;

            border-radius: 9px;

            background: transparent;

            color: #bfc7d2;

            text-align: left;
        }


        .history-item:hover {

            background: #171e27;
        }


        .history-item.active {

            background: #1c2632;

            color: white;
        }


        .history-name {

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }


        /* =================================
           SIDEBAR FOOTER
        ================================= */

        .sidebar-footer {

            padding: 12px;

            border-top:
                1px solid #202731;
        }


        .footer-button {

            width: 100%;

            padding: 9px;

            margin-top: 5px;

            border: 0;

            border-radius: 8px;

            background: transparent;

            color: #8994a3;

            text-align: left;
        }


        .footer-button:hover {

            background: #171e27;

            color: white;
        }


        /* =================================
           MAIN
        ================================= */

        .main {

            min-width: 0;

            flex: 1;

            height: 100%;

            display: flex;

            flex-direction: column;

            background: #0b0f14;
        }


        /* =================================
           TOP BAR
        ================================= */

        .topbar {

            height: 60px;

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                0 18px;

            border-bottom:
                1px solid #202731;
        }


        .menu-button {

            display: none;

            width: 36px;
            height: 36px;

            border: 0;

            border-radius: 8px;

            background: transparent;

            color: white;

            font-size: 20px;
        }


        .menu-button:hover {

            background: #171e27;
        }


        .chat-title {

            font-size: 15px;

            font-weight: 600;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }


        .status {

            margin-left: auto;

            display: flex;

            align-items: center;

            gap: 6px;

            color: #6f7b89;

            font-size: 11px;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;
        }


        .status.busy .status-dot {

            background: #f59e0b;

            animation:
                pulse 1s infinite;
        }


        @keyframes pulse {

            0% {
                opacity: .3;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: .3;
            }
        }


        /* =================================
           CHAT
        ================================= */

        .chat {

            flex: 1;

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding:
                25px 20px;

            overflow-y: auto;
        }


        /* =================================
           WELCOME
        ================================= */

        .welcome {

            min-height: 70%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        .welcome-logo {

            width: 58px;
            height: 58px;

            display: grid;

            place-items: center;

            border-radius: 17px;

            background: #2563eb;

            font-size: 24px;

            font-weight: 800;
        }


        .welcome h1 {

            margin:
                18px 0 6px;

            font-size: 28px;
        }


        .welcome p {

            margin: 0;

            color: #727e8d;
        }


        .examples {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;

            margin-top: 22px;
        }


        .example {

            padding:
                9px 12px;

            border:
                1px solid #293240;

            border-radius: 9px;

            background: #121820;

            color: #bfc8d4;
        }


        .example:hover {

            background: #1a222c;
        }


        /* =================================
           MESSAGES
        ================================= */

        .message-row {

            display: flex;

            margin-bottom: 22px;
        }


        .message-row.user {

            justify-content: flex-end;
        }


        .message-row.ai {

            justify-content: flex-start;
        }


        .message {

            max-width: 80%;

            padding:
                13px 15px;

            border-radius: 15px;

            line-height: 1.55;

            overflow-wrap: anywhere;
        }


        .message.user {

            background: #2563eb;

            white-space: pre-wrap;
        }


        .message.ai {

            background: #171d25;

            border:
                1px solid #252d38;
        }


        /* =================================
           THINKING / ACTIVITY
        ================================= */

        .activity-row {

            display: flex;

            justify-content: flex-start;

            margin-bottom: 18px;
        }


        .activity {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            padding:
                10px 13px;

            border:
                1px solid #252d38;

            border-radius: 12px;

            background: #131920;

            color: #8995a5;

            font-size: 12px;
        }


        .activity-spinner {

            width: 15px;
            height: 15px;

            border:
                2px solid #303946;

            border-top-color:
                #3b82f6;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        .activity-icon {

            font-size: 14px;
        }


        .activity-text {

            min-width: 100px;
        }


        /* =================================
           MARKDOWN
        ================================= */

        .markdown {

            line-height: 1.65;

            word-wrap: break-word;
        }


        .markdown > :first-child {

            margin-top: 0;
        }


        .markdown > :last-child {

            margin-bottom: 0;
        }


        .markdown h1,
        .markdown h2,
        .markdown h3,
        .markdown h4 {

            line-height: 1.3;

            margin-top: 18px;

            margin-bottom: 9px;
        }


        .markdown h1 {

            font-size: 24px;
        }


        .markdown h2 {

            font-size: 20px;
        }


        .markdown h3 {

            font-size: 17px;
        }


        .markdown p {

            margin: 9px 0;
        }


        .markdown ul,
        .markdown ol {

            padding-left: 25px;

            margin: 9px 0;
        }


        .markdown li {

            margin: 4px 0;
        }


        .markdown blockquote {

            margin: 12px 0;

            padding:
                7px 0 7px 13px;

            border-left:
                3px solid #2563eb;

            color: #aab4c2;
        }


        .markdown code {

            padding:
                2px 5px;

            border-radius: 5px;

            background: #0a0f15;

            color: #d9e2ef;

            font-family: monospace;
        }


        .markdown pre {

            overflow-x: auto;

            margin: 12px 0;

            padding: 14px;

            border-radius: 10px;

            background: #080c11;
        }


        .markdown pre code {

            padding: 0;

            background: transparent;

            font-size: 13px;

            white-space: pre;
        }


        .markdown a {

            color: #60a5fa;

            text-decoration: none;
        }


        .markdown a:hover {

            text-decoration: underline;
        }


        .markdown table {

            display: block;

            max-width: 100%;

            overflow-x: auto;

            border-collapse: collapse;
        }


        .markdown th,
        .markdown td {

            padding:
                8px 10px;

            border:
                1px solid #303946;

            text-align: left;
        }


        .markdown th {

            background: #202832;
        }


        /* =================================
           MESSAGE ACTIONS
        ================================= */

        .message-actions {

            display: flex;

            gap: 5px;

            margin-top: 10px;
        }


        .message-action {

            padding:
                4px 7px;

            border: 0;

            border-radius: 6px;

            background: #222a34;

            color: #8e99a8;

            font-size: 11px;
        }


        .message-action:hover {

            color: white;

            background: #2b3542;
        }


        .sources {

            margin-top: 8px;

            color: #707c8b;

            font-size: 10px;
        }


        /* =================================
           COMPOSER
        ================================= */

        .composer {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding:
                10px 20px 16px;
        }


        .input-box {

            display: flex;

            align-items: flex-end;

            gap: 8px;

            padding: 8px;

            border:
                1px solid #303946;

            border-radius: 15px;

            background: #11171f;
        }


        #message {

            flex: 1;

            min-height: 40px;

            max-height: 150px;

            resize: none;

            padding: 9px;

            border: 0;

            outline: 0;

            background: transparent;

            color: white;
        }


        #message::placeholder {

            color: #697583;
        }


        #send {

            width: 40px;
            height: 40px;

            border: 0;

            border-radius: 11px;

            background: #2563eb;

            color: white;

            font-size: 20px;

            font-weight: bold;
        }


        #send:disabled {

            opacity: .35;

            cursor: not-allowed;
        }


        .hint {

            padding-top: 6px;

            text-align: center;

            color: #505b69;

            font-size: 10px;
        }


        /* =================================
           MOBILE
        ================================= */

        .overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, .5);

            z-index: 5;
        }


        @media (max-width: 700px) {

            .sidebar {

                position: fixed;

                left: 0;

                top: 0;

                bottom: 0;

                z-index: 10;

                transform:
                    translateX(-100%);
            }


            .sidebar.open {

                transform:
                    translateX(0);
            }


            .overlay.show {

                display: block;
            }


            .menu-button {

                display: block;
            }


            .status {

                display: none;
            }


            .chat {

                padding:
                    18px 12px;
            }


            .composer {

                padding:
                    8px 12px 12px;
            }


            .message {

                max-width: 90%;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =================================
         SIDEBAR
    ================================= -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="sidebar-header">

            <div class="brand">

                <div class="logo">
                    C
                </div>

                <div>

                    <div class="brand-name">
                        CrazeMind
                    </div>

                    <div class="brand-sub">
                        CrazeStudio AI
                    </div>

                </div>

            </div>


            <button
                id="newChat"
                class="new-chat"
            >
                + New chat
            </button>

        </div>


        <div class="history-search">

            <input
                id="historySearch"
                type="search"
                placeholder="Search chats..."
            >

        </div>


        <div
            id="history"
            class="history"
        ></div>


        <div class="sidebar-footer">

            <button
                id="exportAll"
                class="footer-button"
            >
                ↓ Export chats
            </button>


            <button
                id="clearAll"
                class="footer-button"
            >
                🗑 Clear all chats
            </button>

        </div>

    </aside>


    <div
        id="overlay"
        class="overlay"
    ></div>


    <!-- =================================
         MAIN
    ================================= -->

    <main class="main">


        <header class="topbar">

            <button
                id="menuButton"
                class="menu-button"
            >
                ☰
            </button>


            <div
                id="chatTitle"
                class="chat-title"
            >
                New chat
            </div>


            <div
                id="status"
                class="status"
            >

                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                <span
                    id="statusText"
                >
                    Ready
                </span>

            </div>

        </header>


        <section
            id="chat"
            class="chat"
        ></section>


        <footer class="composer">

            <div class="input-box">

                <textarea
                    id="message"
                    rows="1"
                    placeholder="Message CrazeMind..."
                    autocomplete="off"
                ></textarea>


                <button
                    id="send"
                    type="button"
                >
                    ↑
                </button>

            </div>


            <div class="hint">

                CrazeMind can make mistakes.
                Check important information.

            </div>

        </footer>


    </main>

</div>


<script type="module">


/* =============================================
   IMPORT BRAIN
============================================= */

import {
    answerQuestion
} from "../Backend/brain.js";


/* =============================================
   STORAGE
============================================= */

const STORAGE_KEY =
    "crazemind_chats_v2";


let chats =
    loadChats();


let currentChatId =
    null;


/* =============================================
   ELEMENTS
============================================= */

const sidebar =
    document.getElementById(
        "sidebar"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const history =
    document.getElementById(
        "history"
    );


const historySearch =
    document.getElementById(
        "historySearch"
    );


const chat =
    document.getElementById(
        "chat"
    );


const messageInput =
    document.getElementById(
        "message"
    );


const sendButton =
    document.getElementById(
        "send"
    );


const chatTitle =
    document.getElementById(
        "chatTitle"
    );


const status =
    document.getElementById(
        "status"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


/* =============================================
   STORAGE
============================================= */

function loadChats() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            return [];
        }


        const parsed =
            JSON.parse(
                saved
            );


        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch {

        return [];
    }
}


function saveChats() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            chats
        )
    );
}


/* =============================================
   STATUS
============================================= */

function setStatus(
    text,
    busy = false
) {

    statusText.textContent =
        text;


    if (busy) {

        status.classList.add(
            "busy"
        );

    } else {

        status.classList.remove(
            "busy"
        );
    }
}


/* =============================================
   ACTIVITY
============================================= */

function getActivity(
    question
) {

    const q =
        question
            .trim()
            .toLowerCase();


    if (
        q.startsWith(
            "/search"
        )
    ) {

        return {

            icon: "🔎",

            text:
                "Searching the web…"
        };
    }


    if (
        q.startsWith(
            "/wiki"
        )
    ) {

        return {

            icon: "📚",

            text:
                "Reading Wikipedia…"
        };
    }


    if (
        q.startsWith(
            "/math"
        )
    ) {

        return {

            icon: "🧮",

            text:
                "Calculating…"
        };
    }


    if (
        q.startsWith(
            "/train"
        )
    ) {

        return {

            icon: "🏋️",

            text:
                "Training CrazeMind…"
        };
    }


    if (
        q.startsWith(
            "/help"
        ) ||
        q.startsWith(
            "/about"
        )
    ) {

        return {

            icon: "⚙️",

            text:
                "Processing command…"
        };
    }


    if (
        q.startsWith(
            "/ask"
        )
    ) {

        return {

            icon: "🧠",

            text:
                "Thinking…"
        };
    }


    return {

        icon: "🧠",

        text:
            "Thinking…"
    };
}


/* =============================================
   SHOW ACTIVITY
============================================= */

function showActivity(
    question
) {

    removeActivity();


    const activity =
        getActivity(
            question
        );


    const row =
        document.createElement(
            "div"
        );


    row.id =
        "activityRow";


    row.className =
        "activity-row";


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "activity";


    const spinner =
        document.createElement(
            "div"
        );


    spinner.className =
        "activity-spinner";


    const icon =
        document.createElement(
            "span"
        );


    icon.className =
        "activity-icon";


    icon.textContent =
        activity.icon;


    const text =
        document.createElement(
            "span"
        );


    text.className =
        "activity-text";


    text.textContent =
        activity.text;


    box.appendChild(
        spinner
    );


    box.appendChild(
        icon
    );


    box.appendChild(
        text
    );


    row.appendChild(
        box
    );


    chat.appendChild(
        row
    );


    scrollBottom();


    setStatus(
        activity.text,
        true
    );
}


/* =============================================
   REMOVE ACTIVITY
============================================= */

function removeActivity() {

    const old =
        document.getElementById(
            "activityRow"
        );


    if (old) {

        old.remove();
    }
}


/* =============================================
   SCROLL
============================================= */

function scrollBottom() {

    requestAnimationFrame(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );
}


/* =============================================
   CREATE CHAT
============================================= */

function createChat() {

    const newChat = {

        id:
            crypto.randomUUID(),

        title:
            "New chat",

        createdAt:
            Date.now(),

        updatedAt:
            Date.now(),

        messages: []
    };


    chats.unshift(
        newChat
    );


    currentChatId =
        newChat.id;


    saveChats();


    renderHistory();

    renderChat();

    closeSidebar();
}


/* =============================================
   GET CURRENT CHAT
============================================= */

function getCurrentChat() {

    return chats.find(
        item =>
            item.id ===
            currentChatId
    );
}


/* =============================================
   TITLE
============================================= */

function generateTitle(
    text
) {

    let title =
        text
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    title =
        title.replace(
            /^\/[a-zA-Z]+\s*/,
            ""
        );


    if (!title) {

        return "New chat";
    }


    if (
        title.length > 35
    ) {

        title =
            title.slice(
                0,
                35
            ) +
            "...";
    }


    return title;
}


/* =============================================
   HISTORY
============================================= */

function renderHistory() {

    const search =
        historySearch.value
            .trim()
            .toLowerCase();


    history.innerHTML =
        "";


    const heading =
        document.createElement(
            "div"
        );


    heading.className =
        "history-title";


    heading.textContent =
        "Chats";


    history.appendChild(
        heading
    );


    const filtered =
        chats.filter(
            item =>
                !search ||
                item.title
                    .toLowerCase()
                    .includes(search)
        );


    if (!filtered.length) {

        const empty =
            document.createElement(
                "div"
            );


        empty.style.padding =
            "15px 8px";


        empty.style.color =
            "#687483";


        empty.style.fontSize =
            "12px";


        empty.textContent =
            "No chats found.";


        history.appendChild(
            empty
        );


        return;
    }


    filtered.forEach(
        item => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "history-item";


            if (
                item.id ===
                currentChatId
            ) {

                button.classList.add(
                    "active"
                );
            }


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "history-name";


            name.textContent =
                item.title;


            button.appendChild(
                name
            );


            button.onclick =
                () => {

                    currentChatId =
                        item.id;


                    renderHistory();

                    renderChat();

                    closeSidebar();
                };


            history.appendChild(
                button
            );
        }
    );
}


/* =============================================
   RENDER CHAT
============================================= */

function renderChat() {

    removeActivity();


    chat.innerHTML =
        "";


    const current =
        getCurrentChat();


    if (
        !current ||
        current.messages.length === 0
    ) {

        const welcome =
            document.createElement(
                "div"
            );


        welcome.className =
            "welcome";


        welcome.innerHTML = `

            <div class="welcome-logo">
                C
            </div>

            <h1>
                How can I help?
            </h1>

            <p>
                Ask CrazeMind anything.
            </p>

            <div class="examples">

                <button
                    class="example"
                    data-question="What is artificial intelligence?"
                >
                    🧠 Explain AI
                </button>


                <button
                    class="example"
                    data-question="/search Albert Einstein"
                >
                    🔎 Search
                </button>


                <button
                    class="example"
                    data-question="/wiki Minecraft"
                >
                    📚 Wikipedia
                </button>


                <button
                    class="example"
                    data-question="/math 2^100"
                >
                    🧮 Solve math
                </button>


                <button
                    class="example"
                    data-question="/help"
                >
                    ⚙️ Commands
                </button>

            </div>
        `;


        chat.appendChild(
            welcome
        );


        welcome
            .querySelectorAll(
                ".example"
            )
            .forEach(
                button => {

                    button.onclick =
                        () => {

                            messageInput.value =
                                button.dataset.question;


                            messageInput.focus();
                        };
                }
            );


        chatTitle.textContent =
            "New chat";


        return;
    }


    chatTitle.textContent =
        current.title;


    current.messages.forEach(
        message => {

            renderMessage(
                message
            );
        }
    );


    scrollBottom();
}


/* =============================================
   RENDER MESSAGE
============================================= */

function renderMessage(
    message
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row " +
        (
            message.role === "user"
                ? "user"
                : "ai"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message " +
        (
            message.role === "user"
                ? "user"
                : "ai"
        );


    const text =
        document.createElement(
            "div"
        );


    if (
        message.role === "ai"
    ) {

        text.className =
            "markdown";


        const rawHTML =
            marked.parse(
                message.text || "",
                {
                    breaks: true,
                    gfm: true
                }
            );


        text.innerHTML =
            DOMPurify.sanitize(
                rawHTML
            );

    } else {

        text.textContent =
            message.text;
    }


    bubble.appendChild(
        text
    );


    if (
        message.sources &&
        message.sources.length
    ) {

        const sources =
            document.createElement(
                "div"
            );


        sources.className =
            "sources";


        sources.textContent =
            "Source: " +
            message.sources.join(
                ", "
            );


        bubble.appendChild(
            sources
        );
    }


    if (
        message.role === "ai"
    ) {

        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "message-actions";


        const copy =
            document.createElement(
                "button"
            );


        copy.className =
            "message-action";


        copy.textContent =
            "Copy";


        copy.onclick =
            async () => {

                try {

                    await navigator
                        .clipboard
                        .writeText(
                            message.text
                        );


                    copy.textContent =
                        "Copied";

                } catch {

                    copy.textContent =
                        "Failed";
                }


                setTimeout(
                    () => {

                        copy.textContent =
                            "Copy";

                    },
                    1200
                );
            };


        actions.appendChild(
            copy
        );


        bubble.appendChild(
            actions
        );
    }


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );
}


/* =============================================
   SEND MESSAGE
============================================= */

async function sendMessage() {

    const question =
        messageInput.value
            .trim();


    if (!question) {

        return;
    }


    if (!currentChatId) {

        createChat();
    }


    const current =
        getCurrentChat();


    if (!current) {

        return;
    }


    /* ------------------------------
       USER MESSAGE
    ------------------------------ */

    current.messages.push({

        role:
            "user",

        text:
            question,

        createdAt:
            Date.now()
    });


    if (
        current.messages.length === 1
    ) {

        current.title =
            generateTitle(
                question
            );
    }


    current.updatedAt =
        Date.now();


    messageInput.value =
        "";


    saveChats();


    renderHistory();

    renderChat();


    /* ------------------------------
       SHOW REAL ACTIVITY
    ------------------------------ */

    showActivity(
        question
    );


    sendButton.disabled =
        true;


    messageInput.disabled =
        true;


    try {

        const result =
            await answerQuestion(
                question
            );


        /* Remove "Thinking..." */

        removeActivity();


        /* --------------------------
           AI MESSAGE
        -------------------------- */

        current.messages.push({

            role:
                "ai",

            text:
                result.answer ||
                "I couldn't generate an answer.",

            sources:
                result.sources ||
                [],

            createdAt:
                Date.now()
        });


        current.updatedAt =
            Date.now();


        saveChats();


        renderChat();


        setStatus(
            "Complete",
            false
        );


        /*
           Return to Ready after
           a short moment.
        */

        setTimeout(
            () => {

                if (
                    !sendButton.disabled
                ) {

                    setStatus(
                        "Ready",
                        false
                    );
                }

            },
            1200
        );


    } catch (error) {

        console.error(
            "CrazeMind:",
            error
        );


        removeActivity();


        current.messages.push({

            role:
                "ai",

            text:
                "## Error\n\n" +
                "`" +
                error.message +
                "`",

            sources: [],

            createdAt:
                Date.now()
        });


        saveChats();


        renderChat();


        setStatus(
            "Error",
            false
        );
    }


    sendButton.disabled =
        false;


    messageInput.disabled =
        false;


    messageInput.focus();


    scrollBottom();
}


/* =============================================
   NEW CHAT
============================================= */

document
    .getElementById(
        "newChat"
    )
    .addEventListener(
        "click",
        createChat
    );


/* =============================================
   SEARCH HISTORY
============================================= */

historySearch.addEventListener(
    "input",
    renderHistory
);


/* =============================================
   SEND BUTTON
============================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =============================================
   ENTER
============================================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =============================================
   CLEAR ALL
============================================= */

document
    .getElementById(
        "clearAll"
    )
    .addEventListener(
        "click",
        () => {

            if (
                !confirm(
                    "Delete all saved chats?"
                )
            ) {

                return;
            }


            chats = [];


            currentChatId =
                null;


            saveChats();


            createChat();
        }
    );


/* =============================================
   EXPORT
============================================= */

document
    .getElementById(
        "exportAll"
    )
    .addEventListener(
        "click",
        () => {

            const data =
                JSON.stringify(
                    chats,
                    null,
                    2
                );


            const blob =
                new Blob(
                    [data],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "crazemind-chats.json";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );
        }
    );


/* =============================================
   MOBILE MENU
============================================= */

document
    .getElementById(
        "menuButton"
    )
    .addEventListener(
        "click",
        () => {

            sidebar.classList.add(
                "open"
            );


            overlay.classList.add(
                "show"
            );
        }
    );


function closeSidebar() {

    sidebar.classList.remove(
        "open"
    );


    overlay.classList.remove(
        "show"
    );
}


overlay.addEventListener(
    "click",
    closeSidebar
);


/* =============================================
   START
============================================= */

if (
    chats.length > 0
) {

    currentChatId =
        chats[0].id;

} else {

    createChat();
}


renderHistory();

renderChat();

messageInput.focus();

</script>
