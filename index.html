<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CrazeMind Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
        }

        .toolbar {
            height: 56px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #11161d;
            border-bottom: 1px solid #29313d;
        }

        .title {
            font-weight: bold;
            margin-right: auto;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 9px 14px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .preview {
            width: 100%;
            height: calc(100% - 56px);
            border: 0;
            background: white;
        }
    </style>
</head>

<body>

    <div class="toolbar">

        <div class="title">
            CrazeMind Frontend Preview
        </div>

        <button id="reload">
            Reload
        </button>

        <button id="newTab">
            Open
        </button>

    </div>


    <iframe
        id="preview"
        class="preview"
        src="./Frontend/index.html"
    ></iframe>


    <script>

        const preview =
            document.getElementById(
                "preview"
            );


        document
            .getElementById("reload")
            .addEventListener(
                "click",
                () => {

                    preview.src =
                        "./Frontend/index.html?" +
                        Date.now();

                }
            );


        document
            .getElementById("newTab")
            .addEventListener(
                "click",
                () => {

                    window.open(
                        "./Frontend/index.html",
                        "_blank"
                    );

                }
            );

    </script>

</body>
</html>
