<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b0f14"
    >

    <title>CrazeMind</title>


    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Security -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #0b0f14;

            color: #f4f7fb;
        }


        button,
        input,
        textarea {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        /* =================================
           APP
        ================================= */

        .app {

            width: 100%;
            height: 100%;

            display: flex;
        }


        /* =================================
           SIDEBAR
        ================================= */

        .sidebar {

            width: 280px;
            height: 100%;

            display: flex;
            flex-direction: column;

            background: #0f141b;

            border-right:
                1px solid #202731;

            transition:
                transform .25s ease;
        }


        .sidebar-header {

            padding: 16px;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 16px;
        }


        .logo {

            width: 38px;
            height: 38px;

            display: grid;

            place-items: center;

            border-radius: 11px;

            background: #2563eb;

            font-size: 18px;

            font-weight: 800;
        }


        .brand-name {

            font-weight: 700;

            font-size: 16px;
        }


        .brand-sub {

            margin-top: 2px;

            color: #6f7a89;

            font-size: 11px;
        }


        .new-chat {

            width: 100%;

            padding: 11px;

            border:
                1px solid #293240;

            border-radius: 10px;

            background: #161d26;

            color: #e8edf4;
        }


        .new-chat:hover {

            background: #1c2530;
        }


        /* =================================
           SEARCH CHATS
        ================================= */

        .history-search {

            margin:
                0 16px 12px;
        }


        .history-search input {

            width: 100%;

            padding:
                10px 11px;

            border:
                1px solid #293240;

            border-radius: 9px;

            outline: none;

            background: #0b1016;

            color: white;
        }


        .history-search input:focus {

            border-color: #2563eb;
        }


        /* =================================
           HISTORY
        ================================= */

        .history {

            flex: 1;

            overflow-y: auto;

            padding:
                0 10px;
        }


        .history-title {

            padding:
                8px 7px;

            color: #687483;

            font-size: 11px;

            text-transform: uppercase;
        }


        .history-item {

            width: 100%;

            display: flex;

            padding:
                10px 9px;

            margin-bottom: 3px;

            border: 0;

            border-radius: 9px;

            background: transparent;

            color: #bfc7d2;

            text-align: left;
        }


        .history-item:hover {

            background: #171e27;
        }


        .history-item.active {

            background: #1c2632;

            color: white;
        }


        .history-name {

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }


        /* =================================
           SIDEBAR FOOTER
        ================================= */

        .sidebar-footer {

            padding: 12px;

            border-top:
                1px solid #202731;
        }


        .footer-button {

            width: 100%;

            padding: 9px;

            margin-top: 5px;

            border: 0;

            border-radius: 8px;

            background: transparent;

            color: #8994a3;

            text-align: left;
        }


        .footer-button:hover {

            background: #171e27;

            color: white;
        }


        /* =================================
           MAIN
        ================================= */

        .main {

            min-width: 0;

            flex: 1;

            height: 100%;

            display: flex;

            flex-direction: column;

            background: #0b0f14;
        }


        /* =================================
           TOP BAR
        ================================= */

        .topbar {

            height: 60px;

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                0 18px;

            border-bottom:
                1px solid #202731;
        }


        .menu-button {

            display: none;

            width: 36px;
            height: 36px;

            border: 0;

            border-radius: 8px;

            background: transparent;

            color: white;

            font-size: 20px;
        }


        .menu-button:hover {

            background: #171e27;
        }


        .chat-title {

            font-size: 15px;

            font-weight: 600;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }


        .status {

            margin-left: auto;

            display: flex;

            align-items: center;

            gap: 6px;

            color: #6f7b89;

            font-size: 11px;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;
        }


        .status.busy .status-dot {

            background: #f59e0b;

            animation:
                pulse 1s infinite;
        }


        @keyframes pulse {

            0% {
                opacity: .3;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: .3;
            }
        }


        /* =================================
           CHAT
        ================================= */

        .chat {

            flex: 1;

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding:
                25px 20px;

            overflow-y: auto;
        }


        /* =================================
           WELCOME
        ================================= */

        .welcome {

            min-height: 70%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        .welcome-logo {

            width: 58px;
            height: 58px;

            display: grid;

            place-items: center;

            border-radius: 17px;

            background: #2563eb;

            font-size: 24px;

            font-weight: 800;
        }


        .welcome h1 {

            margin:
                18px 0 6px;

            font-size: 28px;
        }


        .welcome p {

            margin: 0;

            color: #727e8d;
        }


        .examples {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;

            margin-top: 22px;
        }


        .example {

            padding:
                9px 12px;

            border:
                1px solid #293240;

            border-radius: 9px;

            background: #121820;

            color: #bfc8d4;
        }


        .example:hover {

            background: #1a222c;
        }


        /* =================================
           MESSAGES
        ================================= */

        .message-row {

            display: flex;

            margin-bottom: 22px;
        }


        .message-row.user {

            justify-content: flex-end;
        }


        .message-row.ai {

            justify-content: flex-start;
        }


        .message {

            max-width: 80%;

            padding:
                13px 15px;

            border-radius: 15px;

            line-height: 1.55;

            overflow-wrap: anywhere;
        }


        .message.user {

            background: #2563eb;

            white-space: pre-wrap;
        }


        .message.ai {

            background: #171d25;

            border:
                1px solid #252d38;
        }


        /* =================================
           THINKING / ACTIVITY
        ================================= */

        .activity-row {

            display: flex;

            justify-content: flex-start;

            margin-bottom: 18px;
        }


        .activity {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            padding:
                10px 13px;

            border:
                1px solid #252d38;

            border-radius: 12px;

            background: #131920;

            color: #8995a5;

            font-size: 12px;
        }


        .activity-spinner {

            width: 15px;
            height: 15px;

            border:
                2px solid #303946;

            border-top-color:
                #3b82f6;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        .activity-icon {

            font-size: 14px;
        }


        .activity-text {

            min-width: 100px;
        }


        /* =================================
           MARKDOWN
        ================================= */

        .markdown {

            line-height: 1.65;

            word-wrap: break-word;
        }


        .markdown > :first-child {

            margin-top: 0;
        }


        .markdown > :last-child {

            margin-bottom: 0;
        }


        .markdown h1,
        .markdown h2,
        .markdown h3,
        .markdown h4 {

            line-height: 1.3;

            margin-top: 18px;

            margin-bottom: 9px;
        }


        .markdown h1 {

            font-size: 24px;
        }


        .markdown h2 {

            font-size: 20px;
        }


        .markdown h3 {

            font-size: 17px;
        }


        .markdown p {

            margin: 9px 0;
        }


        .markdown ul,
        .markdown ol {

            padding-left: 25px;

            margin: 9px 0;
        }


        .markdown li {

            margin: 4px 0;
        }


        .markdown blockquote {

            margin: 12px 0;

            padding:
                7px 0 7px 13px;

            border-left:
                3px solid #2563eb;

            color: #aab4c2;
        }


        .markdown code {

            padding:
                2px 5px;

            border-radius: 5px;

            background: #0a0f15;

            color: #d9e2ef;

            font-family: monospace;
        }


        .markdown pre {

            overflow-x: auto;

            margin: 12px 0;

            padding: 14px;

            border-radius: 10px;

            background: #080c11;
        }


        .markdown pre code {

            padding: 0;

            background: transparent;

            font-size: 13px;

            white-space: pre;
        }


        .markdown a {

            color: #60a5fa;

            text-decoration: none;
        }


        .markdown a:hover {

            text-decoration: underline;
        }


        .markdown table {

            display: block;

            max-width: 100%;

            overflow-x: auto;

            border-collapse: collapse;
        }


        .markdown th,
        .markdown td {

            padding:
                8px 10px;

            border:
                1px solid #303946;

            text-align: left;
        }


        .markdown th {

            background: #202832;
        }


        /* =================================
           MESSAGE ACTIONS
        ================================= */

        .message-actions {

            display: flex;

            gap: 5px;

            margin-top: 10px;
        }


        .message-action {

            padding:
                4px 7px;

            border: 0;

            border-radius: 6px;

            background: #222a34;

            color: #8e99a8;

            font-size: 11px;
        }


        .message-action:hover {

            color: white;

            background: #2b3542;
        }


        .sources {

            margin-top: 8px;

            color: #707c8b;

            font-size: 10px;
        }


        /* =================================
           COMPOSER
        ================================= */

        .composer {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding:
                10px 20px 16px;
        }


        .input-box {

            display: flex;

            align-items: flex-end;

            gap: 8px;

            padding: 8px;

            border:
                1px solid #303946;

            border-radius: 15px;

            background: #11171f;
        }


        #message {

            flex: 1;

            min-height: 40px;

            max-height: 150px;

            resize: none;

            padding: 9px;

            border: 0;

            outline: 0;

            background: transparent;

            color: white;
        }


        #message::placeholder {

            color: #697583;
        }


        #send {

            width: 40px;
            height: 40px;

            border: 0;

            border-radius: 11px;

            background: #2563eb;

            color: white;

            font-size: 20px;

            font-weight: bold;
        }


        #send:disabled {

            opacity: .35;

            cursor: not-allowed;
        }


        .hint {

            padding-top: 6px;

            text-align: center;

            color: #505b69;

            font-size: 10px;
        }


        /* =================================
           MOBILE
        ================================= */

        .overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, .5);

            z-index: 5;
        }


        @media (max-width: 700px) {

            .sidebar {

                position: fixed;

                left: 0;

                top: 0;

                bottom: 0;

                z-index: 10;

                transform:
                    translateX(-100%);
            }


            .sidebar.open {

                transform:
                    translateX(0);
            }


            .overlay.show {

                display: block;
            }


            .menu-button {

                display: block;
            }


            .status {

                display: none;
            }


            .chat {

                padding:
                    18px 12px;
            }


            .composer {

                padding:
                    8px 12px 12px;
            }


            .message {

                max-width: 90%;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =================================
         SIDEBAR
    ================================= -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="sidebar-header">

            <div class="brand">

                <div class="logo">
                    C
                </div>

                <div>

                    <div class="brand-name">
                        CrazeMind
                    </div>

                    <div class="brand-sub">
                        CrazeStudio AI
                    </div>

                </div>

            </div>


            <button
                id="newChat"
                class="new-chat"
            >
                + New chat
            </button>

        </div>


        <div class="history-search">

            <input
                id="historySearch"
                type="search"
                placeholder="Search chats..."
            >

        </div>


        <div
            id="history"
            class="history"
        ></div>


        <div class="sidebar-footer">

            <button
                id="exportAll"
                class="footer-button"
            >
                ↓ Export chats
            </button>


            <button
                id="clearAll"
                class="footer-button"
            >
                🗑 Clear all chats
            </button>

        </div>

    </aside>


    <div
        id="overlay"
        class="overlay"
    ></div>


    <!-- =================================
         MAIN
    ================================= -->

    <main class="main">


        <header class="topbar">

            <button
                id="menuButton"
                class="menu-button"
            >
                ☰
            </button>


            <div
                id="chatTitle"
                class="chat-title"
            >
                New chat
            </div>


            <div
                id="status"
                class="status"
            >

                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                <span
                    id="statusText"
                >
                    Ready
                </span>

            </div>

        </header>


        <section
            id="chat"
            class="chat"
        ></section>


        <footer class="composer">

            <div class="input-box">

                <textarea
                    id="message"
                    rows="1"
                    placeholder="Message CrazeMind..."
                    autocomplete="off"
                ></textarea>


                <button
                    id="send"
                    type="button"
                >
                    ↑
                </button>

            </div>


            <div class="hint">

                CrazeMind can make mistakes.
                Check important information.

            </div>

        </footer>


    </main>

</div>


<script type="module">


/* ============================================================
   BRAIN IMPORT
   ============================================================

   index.html is now at:

   /Nexus/index.html

   brain.js is at:

   /Nexus/Backend/brain.js

   Therefore the correct path is:

   ./Backend/brain.js
============================================================ */

import {
    answerQuestion
} from "./Backend/brain.js";


/* ============================================================
   STORAGE
============================================================ */

const STORAGE_KEY =
    "crazemind_chats_v3";


let chats =
    loadChats();


let currentChatId =
    null;


/* ============================================================
   ELEMENTS
============================================================ */

const sidebar =
    document.getElementById(
        "sidebar"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const history =
    document.getElementById(
        "history"
    );


const historySearch =
    document.getElementById(
        "historySearch"
    );


const chat =
    document.getElementById(
        "chat"
    );


const messageInput =
    document.getElementById(
        "message"
    );


const sendButton =
    document.getElementById(
        "send"
    );


const chatTitle =
    document.getElementById(
        "chatTitle"
    );


const status =
    document.getElementById(
        "status"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const newChatButton =
    document.getElementById(
        "newChat"
    );


const exportAllButton =
    document.getElementById(
        "exportAll"
    );


const clearAllButton =
    document.getElementById(
        "clearAll"
    );


const menuButton =
    document.getElementById(
        "menuButton"
    );


/* ============================================================
   ID
============================================================ */

function createId() {

    try {

        if (
            crypto &&
            typeof crypto.randomUUID ===
            "function"
        ) {

            return crypto.randomUUID();
        }

    } catch {

        /* fallback below */

    }


    return (
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


/* ============================================================
   STORAGE
============================================================ */

function loadChats() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            return [];
        }


        const parsed =
            JSON.parse(
                saved
            );


        if (
            !Array.isArray(
                parsed
            )
        ) {

            return [];
        }


        return parsed.map(
            item => ({

                id:
                    String(
                        item.id ||
                        createId()
                    ),

                title:
                    String(
                        item.title ||
                        "New chat"
                    ),

                createdAt:
                    Number(
                        item.createdAt ||
                        Date.now()
                    ),

                updatedAt:
                    Number(
                        item.updatedAt ||
                        Date.now()
                    ),

                messages:
                    Array.isArray(
                        item.messages
                    )
                        ? item.messages
                        : []

            })
        );

    } catch (
        error
    ) {

        console.error(
            "[CrazeMind] Failed to load chats:",
            error
        );

        return [];
    }
}


function saveChats() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                chats
            )
        );

    } catch (
        error
    ) {

        console.error(
            "[CrazeMind] Failed to save chats:",
            error
        );
    }
}


/* ============================================================
   STATUS
============================================================ */

function setStatus(
    text,
    busy = false
) {

    statusText.textContent =
        text;


    if (
        busy
    ) {

        status.classList.add(
            "busy"
        );

    } else {

        status.classList.remove(
            "busy"
        );
    }
}


/* ============================================================
   ACTIVITY
============================================================ */

function getActivity(
    question
) {

    const q =
        String(
            question
        )
            .trim()
            .toLowerCase();


    if (
        q.startsWith(
            "/search"
        )
    ) {

        return {

            icon:
                "🔎",

            text:
                "Searching..."

        };
    }


    if (
        q.startsWith(
            "/wiki"
        )
    ) {

        return {

            icon:
                "📚",

            text:
                "Reading Wikipedia..."

        };
    }


    if (
        q.startsWith(
            "/train"
        )
    ) {

        return {

            icon:
                "🏋️",

            text:
                "Training CrazeMind..."

        };
    }


    if (
        q.startsWith(
            "/stats"
        )
    ) {

        return {

            icon:
                "📊",

            text:
                "Checking brain stats..."

        };
    }


    if (
        q.startsWith(
            "/clear"
        )
    ) {

        return {

            icon:
                "🧹",

            text:
                "Clearing memory..."

        };
    }


    if (
        q.startsWith(
            "/download"
        )
    ) {

        return {

            icon:
                "⬇️",

            text:
                "Preparing download..."

        };
    }


    return {

        icon:
            "🧠",

        text:
            "Thinking..."

    };
}


/* ============================================================
   ACTIVITY
============================================================ */

function showActivity(
    question
) {

    removeActivity();


    const activity =
        getActivity(
            question
        );


    const row =
        document.createElement(
            "div"
        );


    row.id =
        "activityRow";


    row.className =
        "activity-row";


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "activity";


    const spinner =
        document.createElement(
            "div"
        );


    spinner.className =
        "activity-spinner";


    const icon =
        document.createElement(
            "span"
        );


    icon.className =
        "activity-icon";


    icon.textContent =
        activity.icon;


    const text =
        document.createElement(
            "span"
        );


    text.className =
        "activity-text";


    text.textContent =
        activity.text;


    box.appendChild(
        spinner
    );


    box.appendChild(
        icon
    );


    box.appendChild(
        text
    );


    row.appendChild(
        box
    );


    chat.appendChild(
        row
    );


    setStatus(
        activity.text,
        true
    );


    scrollBottom();
}


/* ============================================================
   REMOVE ACTIVITY
============================================================ */

function removeActivity() {

    const activity =
        document.getElementById(
            "activityRow"
        );


    if (
        activity
    ) {

        activity.remove();
    }
}


/* ============================================================
   SCROLL
============================================================ */

function scrollBottom() {

    requestAnimationFrame(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );
}


/* ============================================================
   CURRENT CHAT
============================================================ */

function getCurrentChat() {

    return chats.find(
        item =>
            item.id ===
            currentChatId
    );
}


/* ============================================================
   CREATE CHAT
============================================================ */

function createChat() {

    const item = {

        id:
            createId(),

        title:
            "New chat",

        createdAt:
            Date.now(),

        updatedAt:
            Date.now(),

        messages:
            []

    };


    chats.unshift(
        item
    );


    currentChatId =
        item.id;


    saveChats();

    renderHistory();

    renderChat();

    closeSidebar();
}


/* ============================================================
   ENSURE CHAT
============================================================ */

function ensureCurrentChat() {

    let current =
        getCurrentChat();


    if (
        current
    ) {

        return current;
    }


    const item = {

        id:
            createId(),

        title:
            "New chat",

        createdAt:
            Date.now(),

        updatedAt:
            Date.now(),

        messages:
            []

    };


    chats.unshift(
        item
    );


    currentChatId =
        item.id;


    saveChats();


    return item;
}


/* ============================================================
   TITLE
============================================================ */

function generateTitle(
    text
) {

    let title =
        String(
            text
        )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    title =
        title.replace(
            /^\/[a-zA-Z]+\s*/,
            ""
        );


    if (
        !title
    ) {

        return "New chat";
    }


    if (
        title.length >
        40
    ) {

        title =
            title.slice(
                0,
                40
            ) +
            "...";
    }


    return title;
}


/* ============================================================
   HISTORY
============================================================ */

function renderHistory() {

    const search =
        String(
            historySearch.value ||
            ""
        )
            .trim()
            .toLowerCase();


    history.innerHTML =
        "";


    const heading =
        document.createElement(
            "div"
        );


    heading.className =
        "history-title";


    heading.textContent =
        "Chats";


    history.appendChild(
        heading
    );


    const filtered =
        chats.filter(
            item => {

                const title =
                    String(
                        item.title ||
                        ""
                    )
                        .toLowerCase();


                return (
                    !search ||
                    title.includes(
                        search
                    )
                );

            }
        );


    if (
        filtered.length ===
        0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.style.padding =
            "15px 8px";


        empty.style.color =
            "#687483";


        empty.style.fontSize =
            "12px";


        empty.textContent =
            "No chats found.";


        history.appendChild(
            empty
        );


        return;
    }


    filtered.forEach(
        item => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "history-item";


            if (
                item.id ===
                currentChatId
            ) {

                button.classList.add(
                    "active"
                );
            }


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "history-name";


            name.textContent =
                item.title ||
                "New chat";


            button.appendChild(
                name
            );


            button.addEventListener(
                "click",
                () => {

                    currentChatId =
                        item.id;


                    renderHistory();

                    renderChat();

                    closeSidebar();

                }
            );


            history.appendChild(
                button
            );

        }
    );
}


/* ============================================================
   MARKDOWN
============================================================ */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function renderMarkdown(
    value
) {

    const text =
        String(
            value ?? ""
        );


    try {

        if (
            window.marked &&
            typeof window.marked.parse ===
            "function"
        ) {

            const html =
                window.marked.parse(
                    text,
                    {
                        breaks:
                            true,

                        gfm:
                            true
                    }
                );


            if (
                window.DOMPurify &&
                typeof window
                    .DOMPurify
                    .sanitize ===
                "function"
            ) {

                return window
                    .DOMPurify
                    .sanitize(
                        html
                    );
            }


            return html;
        }

    } catch (
        error
    ) {

        console.error(
            "[CrazeMind] Markdown error:",
            error
        );
    }


    return escapeHtml(
        text
    )
        .replace(
            /\n/g,
            "<br>"
        );
}

/* ============================================================
   RENDER CHAT
============================================================ */

function renderChat() {

    removeActivity();


    chat.innerHTML =
        "";


    const current =
        getCurrentChat();


    if (
        !current ||
        !Array.isArray(
            current.messages
        ) ||
        current.messages.length ===
        0
    ) {

        chatTitle.textContent =
            current?.title ||
            "New chat";


        renderWelcome();


        return;
    }


    chatTitle.textContent =
        current.title ||
        "New chat";


    for (
        const message
        of current.messages
    ) {

        renderMessage(
            message
        );
    }


    scrollBottom();
}


/* ============================================================
   RENDER MESSAGE
============================================================ */

function renderMessage(
    message
) {

    const row =
        document.createElement(
            "div"
        );


    const isUser =
        message.role ===
        "user";


    row.className =
        "message-row " +
        (
            isUser
                ? "user"
                : "ai"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message " +
        (
            isUser
                ? "user"
                : "ai"
        );


    const text =
        String(
            message.text ??
            message.content ??
            ""
        );


    if (
        isUser
    ) {

        bubble.textContent =
            text;

    } else {

        const markdown =
            document.createElement(
                "div"
            );


        markdown.className =
            "markdown";


        markdown.innerHTML =
            renderMarkdown(
                text
            );


        bubble.appendChild(
            markdown
        );


        const sources =
            Array.isArray(
                message.sources
            )
                ? message.sources
                : [];


        if (
            sources.length
        ) {

            const sourceBox =
                document.createElement(
                    "div"
                );


            sourceBox.className =
                "sources";


            sourceBox.textContent =
                "Source: " +
                sources.join(
                    ", "
                );


            bubble.appendChild(
                sourceBox
            );
        }


        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "message-actions";


        const copy =
            document.createElement(
                "button"
            );


        copy.type =
            "button";


        copy.className =
            "message-action";


        copy.textContent =
            "Copy";


        copy.addEventListener(
            "click",
            async () => {

                try {

                    await navigator
                        .clipboard
                        .writeText(
                            text
                        );


                    copy.textContent =
                        "Copied";

                } catch {

                    copy.textContent =
                        "Failed";
                }


                setTimeout(
                    () => {

                        copy.textContent =
                            "Copy";

                    },
                    1200
                );
            }
        );


        actions.appendChild(
            copy
        );


        bubble.appendChild(
            actions
        );
    }


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );
}


/* ============================================================
   NORMALIZE BRAIN RESULT
============================================================ */

/*
    THIS IS THE MAIN FIX.

    Your brain.js can return:

        "Hello"

    OR:

        {
            answer: "Hello",
            sources: [...]
        }

    The old frontend only checked:

        result.answer

    which becomes undefined when brain.js
    returns a string.

    This function supports both.
============================================================ */

function normalizeBrainResult(
    result
) {

    if (
        typeof result ===
        "string"
    ) {

        return {

            answer:
                result,

            sources:
                []

        };
    }


    if (
        result &&
        typeof result ===
        "object"
    ) {

        return {

            answer:
                String(
                    result.answer ??
                    result.text ??
                    result.content ??
                    ""
                ),

            sources:
                Array.isArray(
                    result.sources
                )
                    ? result.sources
                    : []

        };
    }


    return {

        answer:
            "",

        sources:
            []

    };
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    const question =
        messageInput.value
            .trim();


    if (
        !question
    ) {

        return;
    }


    const current =
        ensureCurrentChat();


    /* --------------------------------
       USER MESSAGE
    -------------------------------- */

    current.messages.push({

        role:
            "user",

        text:
            question,

        createdAt:
            Date.now()

    });


    if (
        current.messages.length ===
        1
    ) {

        current.title =
            generateTitle(
                question
            );
    }


    current.updatedAt =
        Date.now();


    messageInput.value =
        "";


    saveChats();


    renderHistory();

    renderChat();


    /* --------------------------------
       ACTIVITY
    -------------------------------- */

    showActivity(
        question
    );


    sendButton.disabled =
        true;


    messageInput.disabled =
        true;


    try {

        console.log(
            "[CrazeMind] QUESTION:",
            question
        );


        const rawResult =
            await answerQuestion(
                question
            );


        console.log(
            "[CrazeMind] RAW RESULT:",
            rawResult
        );


        /*
            Convert string/object into
            a consistent structure.
        */

        const result =
            normalizeBrainResult(
                rawResult
            );


        console.log(
            "[CrazeMind] ANSWER:",
            result.answer
        );


        console.log(
            "[CrazeMind] SOURCES:",
            result.sources
        );


        removeActivity();


        if (
            !result.answer ||
            !result.answer.trim()
        ) {

            throw new Error(
                "CrazeMind returned an empty answer."
            );
        }


        /* --------------------------------
           AI MESSAGE
        -------------------------------- */

        current.messages.push({

            role:
                "ai",

            text:
                result.answer,

            sources:
                result.sources,

            createdAt:
                Date.now()

        });


        current.updatedAt =
            Date.now();


        saveChats();


        renderChat();


        setStatus(
            "Complete",
            false
        );


    } catch (
        error
    ) {

        console.error(
            "[CrazeMind] ANSWER ERROR:",
            error
        );


        removeActivity();


        const errorMessage =
            error?.message ||
            String(
                error
            ) ||
            "Unknown error.";


        current.messages.push({

            role:
                "ai",

            text:
                "## CrazeMind Error\n\n" +
                "`" +
                errorMessage
                    .replace(
                        /`/g,
                        "'"
                    ) +
                "`",

            sources:
                [],

            createdAt:
                Date.now()

        });


        current.updatedAt =
            Date.now();


        saveChats();


        renderChat();


        setStatus(
            "Error",
            false
        );

    } finally {

        sendButton.disabled =
            false;


        messageInput.disabled =
            false;


        messageInput.focus();


        scrollBottom();


        setTimeout(
            () => {

                if (
                    !sendButton.disabled
                ) {

                    setStatus(
                        "Ready",
                        false
                    );
                }

            },
            1000
        );
    }
}

            confirm(
                "Delete all saved chats?"
            );


        if (

        ) {

            return;
        }


        chats =
            [];


        currentChatId =
            null;


        saveChats();


        createChat();

    }
);


/* ============================================================
   EXPORT
============================================================ */

exportAllButton.addEventListener(
    "click",
    () => {

        try {

            const data =
                JSON.stringify(
                    chats,
                    null,
                    2
                );


            const blob =
                new Blob(
                    [
                        data
                    ],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "crazemind-chats.json";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );

        } catch (
            error
        ) {

            console.error(
                "[CrazeMind] Export failed:",
                error
            );
        }

    }
);
